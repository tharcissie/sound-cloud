<div class="sidenav" [ngClass]="collapsed ? 'sidenav-collapsed': ''">
    <div class="logo-container">
        <button class="logo" (click)="toggleCollapse()"></button>
        <div class="logo-text" @fadeInOut *ngIf="collapsed">AmaMusic</div>
        <button class="btn-close" @rotate *ngIf="collapsed" (click)="closeSidenav()">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <div @fadeInOut *ngIf="collapsed" class="searchform">
        <mat-form-field appearance="outline">
            <mat-label>Search</mat-label>
            <mat-icon matPrefix fontIcon="search"></mat-icon>
            <input matInput type="text">
        </mat-form-field>
    </div>
    <ul class="sidenav-nav">
        <li class="sidenav-nav-item" *ngFor="let data of navData">
            <a class="sidenav-nav-link" [routerLink]="[data.routeLink]" routerLinkActive="active"
                [routerLinkActiveOptions]="{exact: true}">
                <mat-icon class="sidenav-link-icon" [fontIcon]="data.icon"></mat-icon>
                <span class="sidenav-link-text" @fadeInOut *ngIf="collapsed">
                    {{data.label}}
                </span>
            </a>
        </li>
    </ul>
    <mat-divider class="divider"></mat-divider>
    <div class="footer">
        <mat-icon class="icon" aria-hidden="false" aria-label="home icon" fontIcon="home"></mat-icon>
        <span @fadeInOut *ngIf="collapsed">Welcome to AmaMusic</span>
    </div>
</div>
